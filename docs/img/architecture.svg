<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1306 616" class="dg" role="img" aria-label="Proposed architecture: sources feed the DataService (facts); the HealthService reads them and draws every conclusion (status, findings, alerts); the Planner turns findings into booked studies, retests and exercise sessions; the Notification Center delivers notices and reminders; the crew carries out the plan on the instruments, which closes the loop.">
<defs>
<style>
.dg { --bg: #ffffff; --paper: #ffffff; --ink: #141920; --ink-2: #4a5262; --muted: #7b8494; --line: #dce1e9;
  --accent: #1c5dc2; --core-fill: #edf3fc; --demo: #c2410c; --demo-fill: #fdf1ea; --new: #0f7a52; --new-fill: #e7f5ee;
  --bound-fill: #f8f9fb;
  --font: "Public Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  --mono: "JetBrains Mono", SFMono-Regular, Consolas, Menlo, "DejaVu Sans Mono", monospace; }
@media (prefers-color-scheme: dark) {
  .dg { --bg: #0d1117; --paper: #161b22; --ink: #e6e9ef; --ink-2: #b2b9c5; --muted: #8790a0; --line: #2a3240;
    --accent: #80b0ff; --core-fill: #172338; --demo: #f08b63; --demo-fill: #2a1a12; --new: #5fd3a0; --new-fill: #11291f;
    --bound-fill: #11151b; }
}
.dg .bg { fill: var(--bg); }

.dg { font-family: var(--font); }
.dg .core { fill: var(--core-fill); stroke: var(--accent); stroke-width: 1.6; }
.dg .core-line { fill: none; stroke: var(--accent); stroke-width: 1.6; }
.dg .demo { fill: var(--demo-fill); stroke: var(--demo); stroke-width: 1.6; stroke-dasharray: 6 4; }
.dg .demo-new { fill: var(--demo-fill); stroke: var(--new); stroke-width: 2.2; stroke-dasharray: 6 4; }
.dg .ext { fill: var(--paper); stroke: var(--muted); stroke-width: 1.2; }
.dg .b-outer { fill: var(--bound-fill); stroke: var(--muted); stroke-width: 1.2; stroke-dasharray: 2 5; }
.dg .b-group { fill: none; stroke: var(--line); stroke-width: 1.4; }
.dg .lane { fill: var(--paper); stroke: var(--ink-2); stroke-width: 1.2; }
.dg .e { fill: none; stroke: var(--ink-2); stroke-width: 1.4; }
.dg .e-new { fill: none; stroke: var(--new); stroke-width: 2; }
.dg .e-demo { fill: none; stroke: var(--demo); stroke-width: 1.4; stroke-dasharray: 5 4; }
.dg .mk-ink { fill: var(--ink-2); }
.dg .mk-new { fill: var(--new); }
.dg .mk-demo { fill: var(--demo); }
.dg .p { fill: var(--paper); stroke: var(--line); }
.dg .p-new { fill: var(--new-fill); stroke: var(--new); }
.dg text { fill: var(--ink); }
.dg .t-tag { font: 600 9.5px var(--mono); letter-spacing: 0.08em; fill: var(--muted); }
.dg .t-title { font-size: 14px; font-weight: 700; }
.dg .t-sub { font-size: 11.5px; fill: var(--muted); font-style: italic; }
.dg .t-line { font-size: 11.5px; fill: var(--ink-2); }
.dg .t-line-new { font-size: 11.5px; fill: var(--new); font-weight: 600; }
.dg .t-item { font-size: 12.5px; font-weight: 600; }
.dg .t-group, .dg .t-bound { font: 600 10px var(--mono); letter-spacing: 0.08em; fill: var(--muted); }
.dg .t-lane { font: 600 10px var(--mono); letter-spacing: 0.08em; fill: var(--ink-2); }
.dg .t-lane-topics { font: 10px var(--mono); fill: var(--muted); }
.dg .t-edge { font-size: 10.5px; fill: var(--ink-2); }
.dg .t-pill { font-size: 10.5px; fill: var(--ink); }
.dg .t-pill-mono { font: 10px var(--mono); fill: var(--ink); }
</style>
<marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="mk-ink"/></marker>
<marker id="s-ink" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" class="mk-ink"/></marker>
<marker id="a-new" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="mk-new"/></marker>
<marker id="s-new" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" class="mk-new"/></marker>
<marker id="a-demo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="mk-demo"/></marker>
<marker id="s-demo" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" class="mk-demo"/></marker>
</defs>
<rect width="1306" height="616" class="bg"/>
<rect x="10" y="22" width="1158" height="584" rx="16" class="b-outer"/>
<text x="28" y="44" class="t-bound" text-anchor="start">SPACECRAFT · EVERYTHING INSIDE RUNS ON BOARD</text>
<rect x="16" y="88" width="196" height="348" rx="12" class="b-group"/>
<text x="34" y="110" class="t-group" text-anchor="start">SOURCES</text>
<rect x="26" y="122" width="176" height="52" rx="8" class="ext"/>
<text x="38" y="142" class="t-item" text-anchor="start">Medical instruments</text>
<text x="38" y="159" class="t-line" text-anchor="start">dynamometer · DXA · cycle</text>
<rect x="26" y="184" width="176" height="52" rx="8" class="ext"/>
<text x="38" y="204" class="t-item" text-anchor="start">Wearables</text>
<text x="38" y="221" class="t-line" text-anchor="start">HR · BP · SpO2 · HRV</text>
<rect x="26" y="246" width="176" height="52" rx="8" class="ext"/>
<text x="38" y="266" class="t-item" text-anchor="start">Room sensors</text>
<text x="38" y="283" class="t-line" text-anchor="start">who is in which module</text>
<rect x="26" y="308" width="176" height="52" rx="8" class="ext"/>
<text x="38" y="328" class="t-item" text-anchor="start">Spacesuit</text>
<text x="38" y="345" class="t-line" text-anchor="start">heart rate on a spacewalk</text>
<rect x="26" y="370" width="176" height="52" rx="8" class="ext"/>
<text x="38" y="390" class="t-item" text-anchor="start">Crew timeline</text>
<text x="38" y="407" class="t-line" text-anchor="start">sleep · exercise · EVAs</text>
<rect x="16" y="466" width="196" height="104" rx="10" class="demo"/>
<text x="30" y="486" class="t-tag" text-anchor="start">DEMO · GRAVSIM</text>
<text x="30" y="506" class="t-title" text-anchor="start">Generator</text>
<text x="30" y="526" class="t-line" text-anchor="start">stands in for every source</text>
<text x="30" y="541" class="t-line-new" text-anchor="start">and runs the studies</text>
<text x="30" y="556" class="t-line-new" text-anchor="start">the plan books</text>
<rect x="270" y="100" width="180" height="336" rx="10" class="core"/>
<text x="284" y="120" class="t-tag" text-anchor="start">FACTS</text>
<text x="284" y="140" class="t-title" text-anchor="start">DataService</text>
<text x="284" y="160" class="t-line" text-anchor="start">What was measured and</text>
<text x="284" y="175" class="t-line" text-anchor="start">what is happening now</text>
<text x="284" y="205" class="t-line" text-anchor="start">Cleans every reading,</text>
<text x="284" y="220" class="t-line" text-anchor="start">one unit per measure.</text>
<text x="284" y="235" class="t-line" text-anchor="start">Stores readings, context,</text>
<text x="284" y="250" class="t-line" text-anchor="start">status and plan.</text>
<text x="284" y="280" class="t-line" text-anchor="start">HTTP API :8000</text>
<text x="284" y="295" class="t-line" text-anchor="start">events on the queue</text>
<path d="M290,486 a70,10 0 0,0 140,0 v52 a70,10 0 0,1 -140,0 z" class="core"/>
<path d="M290,486 a70,10 0 0,0 140,0 a70,10 0 0,0 -140,0" class="core-line"/>
<text x="304" y="520" class="t-title" text-anchor="start">Database</text>
<text x="304" y="537" class="t-line" text-anchor="start">SQLite</text>
<rect x="562" y="100" width="210" height="112" rx="10" class="core"/>
<text x="576" y="120" class="t-tag" text-anchor="start">CONCLUSIONS · THE BRAIN</text>
<text x="576" y="140" class="t-title" text-anchor="start">HealthService</text>
<text x="576" y="160" class="t-line" text-anchor="start">status of every measure,</text>
<text x="576" y="175" class="t-line" text-anchor="start">findings, alerts,</text>
<text x="576" y="190" class="t-line" text-anchor="start">who gets told (crew context)</text>
<rect x="562" y="326" width="210" height="120" rx="10" class="demo-new"/>
<text x="576" y="346" class="t-tag" text-anchor="start">WHAT HAPPENS NEXT</text>
<text x="576" y="366" class="t-title" text-anchor="start">Planner</text>
<text x="576" y="382" class="t-sub" text-anchor="start">was: analysis scheduler</text>
<text x="576" y="401" class="t-line" text-anchor="start">Table 8 studies, retests,</text>
<text x="576" y="416" class="t-line-new" text-anchor="start">exercise sessions,</text>
<text x="576" y="431" class="t-line-new" text-anchor="start">fitted to the crew timeline</text>
<rect x="842" y="100" width="170" height="112" rx="10" class="core"/>
<text x="856" y="120" class="t-tag" text-anchor="start">SHOWS IT</text>
<text x="856" y="140" class="t-title" text-anchor="start">Frontend</text>
<text x="856" y="160" class="t-line" text-anchor="start">3D body,</text>
<text x="856" y="175" class="t-line" text-anchor="start">flight measurements,</text>
<text x="856" y="190" class="t-line-new" text-anchor="start">the plan</text>
<rect x="842" y="350" width="170" height="100" rx="10" class="demo"/>
<text x="856" y="370" class="t-tag" text-anchor="start">DELIVERS</text>
<text x="856" y="390" class="t-title" text-anchor="start">Notification Center</text>
<text x="856" y="410" class="t-line" text-anchor="start">sends notices and</text>
<text x="856" y="425" class="t-line" text-anchor="start">reminders, tracks acks</text>
<rect x="472" y="258" width="310" height="24" rx="5" class="lane"/>
<text x="484" y="274" class="t-lane" text-anchor="start">EVENT QUEUE</text>
<text x="772" y="274" class="t-lane-topics" text-anchor="end">data.*  health.*</text>
<rect x="562" y="478" width="450" height="24" rx="5" class="lane"/>
<text x="574" y="494" class="t-lane" text-anchor="start">NOTIFICATION QUEUE</text>
<text x="1002" y="494" class="t-lane-topics" text-anchor="end">health.notice  plan.reminder</text>
