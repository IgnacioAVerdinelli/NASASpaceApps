<path d="M360,436 V476" class="e" marker-start="url(#s-ink)" marker-end="url(#a-ink)"/>
<rect x="337.8" y="447" width="108.4" height="18" rx="9" class="p"/>
<text x="392" y="460" class="t-pill" text-anchor="middle">stores · queries</text>
<path d="M450,270 H470" class="e" marker-end="url(#a-ink)"/>
<path d="M562,150 H452" class="e" marker-start="url(#s-ink)" marker-end="url(#a-ink)"/>
<text x="506" y="128" class="t-edge" text-anchor="middle">reads readings,</text>
<text x="506" y="141" class="t-edge" text-anchor="middle">context</text>
<text x="506" y="168" class="t-edge" text-anchor="middle">saves status</text>
<path d="M562,396 H452" class="e-new" marker-start="url(#s-new)" marker-end="url(#a-new)"/>
<text x="506" y="362" class="t-edge" text-anchor="middle">reads status,</text>
<text x="506" y="375" class="t-edge" text-anchor="middle">timeline, done</text>
<text x="506" y="414" class="t-edge" text-anchor="middle">saves the plan</text>
<path d="M600,258 V214" class="e" marker-end="url(#a-ink)"/>
<rect x="530.5" y="226" width="139.0" height="18" rx="9" class="p"/>
<text x="600" y="239" class="t-pill-mono" text-anchor="middle">data.readings_stored</text>
<rect x="689.2" y="226" width="101.5" height="18" rx="9" class="p-new"/>
<text x="740" y="239" class="t-pill-mono" text-anchor="middle">health.finding</text>
<path d="M740,212 V256" class="e-new" marker-end="url(#a-new)"/>
<path d="M667,282 V324" class="e-new" marker-end="url(#a-new)"/>
<rect x="544.4" y="294" width="245.2" height="18" rx="9" class="p-new"/>
