[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "healthservice"
version = "0.2.0"
description = "HealthService: processes astronaut readings and serves the dashboard (NASA Space Apps 2026)"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.110", "uvicorn[standard]>=0.29"]

[project.optional-dependencies]
dev = ["pytest>=7", "httpx>=0.27"]

[tool.setuptools]
packages = ["healthservice"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
