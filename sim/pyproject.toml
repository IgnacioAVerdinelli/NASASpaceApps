[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "gravsim"
version = "0.1.0"
description = "Synthetic astronaut instrument readings fitted to NASA bed-rest data (NASA Space Apps 2026)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
pandas = ["pandas>=2.0"]
dev = ["pandas>=2.0", "pytest>=7"]

[tool.setuptools]
packages = ["gravsim"]

[tool.setuptools.package-data]
gravsim = ["params.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
