[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "gravsim"
version = "0.2.0"
description = "Synthetic astronaut instrument readings fitted to NASA bed-rest data (NASA Space Apps 2026)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
pandas = ["pandas>=2.0"]
dev = ["pandas>=2.0", "pytest>=7"]

[tool.setuptools]
packages = ["gravsim"]

[tool.setuptools.package-data]
gravsim = ["params.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# the stress tests sample thousands of crew members; run them with  python -m pytest -m slow
markers = ["slow: stress tests against the data ranges and standards (a few minutes)"]
addopts = "-m 'not slow'"
